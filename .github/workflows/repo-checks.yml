name: Repo checks

# Runs on every PR and push to main, with no path filters, so its jobs can be
# required checks on `main`.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: repo-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # actionlint checks workflow syntax, expressions, action inputs and
      # (with the bundled shellcheck) every `run:` script.
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  infra-details:
    name: No infrastructure details
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - run: scripts/check-no-infra-details.sh
