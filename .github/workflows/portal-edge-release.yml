name: Portal edge release

# Releases the portal edge Worker from a `portal-edge/v*` tag on `main`
# (ADR 0005, ADR 0006 as amended), apart from the Marketing Worker:
#
#   verify-tag -> ci -> upload (preview URL) -> promote (owner approves)
#
# The Cloudflare deploy token lives only in the `portal-edge-preview` and
# `portal-edge-production` GitHub Environments, which accept only
# `portal-edge/v*` tags. The Worker holds no secrets. There is no attested
# artifact: the Worker is a few files that wrangler bundles from the tagged
# commit, after CI has passed on that same commit. Rollback is
# `wrangler rollback`; see README.md.

on:
  push:
    tags:
      - "portal-edge/v*"

permissions:
  contents: read

# One release at a time, so promotions can't land out of order. A run waiting
# for approval keeps running; a newer tag waits behind it. GitHub keeps only
# one waiting run per group, so a third tag cancels the second.
concurrency:
  group: portal-edge-release
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}

jobs:
  verify-tag:
    name: Refuse tags not on main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: check
        run: |
          if [[ ! "$TAG" =~ ^portal-edge/(v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Tag '$TAG' is not portal-edge/vMAJOR.MINOR.PATCH."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag '$TAG' points at $GITHUB_SHA, which is not on main. Tag a commit on main."
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: verify-tag
    uses: ./.github/workflows/portal-edge-ci.yml

  upload:
    name: Upload Worker version (preview)
    needs: [verify-tag, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: portal-edge-preview
      url: ${{ steps.upload.outputs.preview_url }}
    outputs:
      version_id: ${{ steps.upload.outputs.version_id }}
      preview_url: ${{ steps.upload.outputs.preview_url }}
    defaults:
      run:
        working-directory: portal-edge
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: portal-edge/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: portal-edge/.nvmrc
          cache: pnpm
          cache-dependency-path: portal-edge/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          VERSION: ${{ needs.verify-tag.outputs.version }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          pnpm exec wrangler versions upload --tag "$VERSION" --message "$TAG ($GITHUB_SHA)"
          result="$(jq -c 'select(.type == "version-upload")' "$WRANGLER_OUTPUT_FILE_PATH" | tail -n 1)"
          version_id="$(jq -r '.version_id // empty' <<<"$result")"
          preview_url="$(jq -r '.preview_url // empty' <<<"$result")"
          if [[ -z "$version_id" ]]; then
            echo "::error::wrangler reported no version ID."
            exit 1
          fi
          if [[ -z "$preview_url" ]]; then
            echo "::error::wrangler reported no preview URL. Enable Preview URLs on the Worker and the account's workers.dev subdomain."
            exit 1
          fi
          {
            echo "version_id=$version_id"
            echo "preview_url=$preview_url"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### $TAG uploaded, not live yet"
            echo
            echo "- Preview: $preview_url (forwards to the live portal)"
            echo "- Worker version: \`$version_id\`"
            echo
            echo "Check the preview, then approve the **portal-edge-production** deployment to promote it."
          } >> "$GITHUB_STEP_SUMMARY"

  promote:
    name: Promote to portal.akimbo.technology
    needs: [verify-tag, upload]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Required reviewer: the owner. The job waits here until they approve.
    environment:
      name: portal-edge-production
      url: https://portal.akimbo.technology
    defaults:
      run:
        working-directory: portal-edge
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: portal-edge/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: portal-edge/.nvmrc
          cache: pnpm
          cache-dependency-path: portal-edge/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          VERSION_ID: ${{ needs.upload.outputs.version_id }}
        run: |
          pnpm exec wrangler versions deploy "$VERSION_ID@100%" --yes --message "Promote $TAG"
          {
            echo "### $TAG is live"
            echo
            echo "Worker version \`$VERSION_ID\` serves 100% of portal.akimbo.technology."
            echo "To undo: \`pnpm exec wrangler rollback --message \"<reason>\"\` from portal-edge/ (README.md)."
          } >> "$GITHUB_STEP_SUMMARY"
