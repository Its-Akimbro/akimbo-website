name: Marketing CI

on:
  # Every PR runs this workflow so `CI gate` can be a required check; the
  # `changes` job skips the real work when a PR doesn't touch the site.
  pull_request:
  push:
    branches: [main]
    paths:
      - "marketing/**"
      - "brand/**"
      - ".github/workflows/marketing-ci.yml"
      - ".github/workflows/marketing-release.yml"
  # The release workflow reruns CI on the tagged commit and deploys the `dist/`
  # this run built and tested, so the bytes that ship are the bytes that passed.
  workflow_call:
    inputs:
      upload-dist:
        description: Upload the tested `dist/` as the `marketing-dist` artifact.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: marketing-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: marketing

jobs:
  changes:
    name: Detect site changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      site: ${{ steps.diff.outputs.site }}
    defaults:
      run:
        working-directory: .
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Pushes to main (already path-filtered) and release tags (via
      # workflow_call) always run the site jobs.
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT" != "pull_request" ]]; then
            echo "site=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA...$HEAD_SHA" |
            grep -qE '^(marketing/|brand/|\.github/workflows/marketing-(ci|release)\.yml$)'; then
            echo "site=true" >> "$GITHUB_OUTPUT"
          else
            echo "site=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: Lint, type-check, build and test
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: marketing/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: marketing/.nvmrc
          cache: pnpm
          cache-dependency-path: marketing/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build
      # Bundles the Worker with wrangler's own esbuild, as a release would.
      # Vitest's Vite pipeline can hide imports wrangler can't bundle.
      - run: pnpm check:bundle
      - run: pnpm test:worker
      - run: pnpm test:site

      - if: inputs.upload-dist
        uses: actions/upload-artifact@v7
        with:
          name: marketing-dist
          path: marketing/dist/
          if-no-files-found: error
          retention-days: 7

  audit:
    name: Dependency audit
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: marketing/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: marketing/.nvmrc

      # Reads the lockfile against the registry's advisories; nothing is
      # installed. Fails on an advisory of any severity.
      - run: pnpm audit

  # The required check on `main`. It passes when the site jobs passed or were
  # skipped because nothing relevant changed, and fails otherwise.
  gate:
    name: CI gate
    needs: [changes, check, audit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              exit 1
            fi
          done
