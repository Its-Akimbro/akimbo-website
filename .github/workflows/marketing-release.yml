name: Marketing release

# Releases the Marketing Site and Worker from a `marketing/v*` tag on `main`
# (ADR 0004 as amended by ADR 0005):
#
#   verify-tag -> ci -> release -> upload (preview URL) -> promote (owner approves)
#
# The Cloudflare deploy token lives only in the `marketing-preview` and
# `marketing-production` GitHub Environments. Worker secrets (Postmark,
# Turnstile) are set from the admin workstation and carry over to every new
# version, so they never pass through CI. Rollback is `wrangler rollback`; see
# README.md.

on:
  push:
    tags:
      - "marketing/v*"

permissions:
  contents: read

# One release at a time, so promotions can't land out of order. A run waiting
# for approval keeps running; a newer tag waits behind it. GitHub keeps only
# one waiting run per group, so a third tag cancels the second.
concurrency:
  group: marketing-release
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}

jobs:
  verify-tag:
    name: Refuse tags not on main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      tarball: ${{ steps.check.outputs.tarball }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: check
        run: |
          if [[ ! "$TAG" =~ ^marketing/(v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Tag '$TAG' is not marketing/vMAJOR.MINOR.PATCH."
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag '$TAG' points at $GITHUB_SHA, which is not on main. Tag a commit on main."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tarball=marketing-$version-dist.tar.gz" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: verify-tag
    uses: ./.github/workflows/marketing-ci.yml
    with:
      upload-dist: true

  release:
    name: Attest dist/ and create the GitHub Release
    needs: [verify-tag, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TARBALL: ${{ needs.verify-tag.outputs.tarball }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: marketing-dist
          path: dist

      - run: tar -czf "$TARBALL" -C dist .

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ env.TARBALL }}

      - env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$TAG" "$TARBALL"
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --title "$TAG"
          --generate-notes

  upload:
    name: Upload Worker version (preview)
    needs: [verify-tag, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: marketing-preview
      url: ${{ steps.upload.outputs.preview_url }}
    permissions:
      contents: read
      attestations: read
    outputs:
      version_id: ${{ steps.upload.outputs.version_id }}
      preview_url: ${{ steps.upload.outputs.preview_url }}
    defaults:
      run:
        working-directory: marketing
    env:
      TARBALL: ${{ needs.verify-tag.outputs.tarball }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: marketing/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: marketing/.nvmrc
          cache: pnpm
          cache-dependency-path: marketing/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Deploy the released bytes, and only after checking they are the ones
      # this repo's release workflow attested.
      - name: Fetch and verify the released dist/
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$TARBALL" --dir "$RUNNER_TEMP"
          gh attestation verify "$RUNNER_TEMP/$TARBALL" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/marketing-release.yml" \
            --source-ref "refs/tags/$TAG"
          rm -rf dist && mkdir dist
          tar -xzf "$RUNNER_TEMP/$TARBALL" -C dist

      - id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          VERSION: ${{ needs.verify-tag.outputs.version }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          pnpm exec wrangler versions upload --tag "$VERSION" --message "$TAG ($GITHUB_SHA)"
          result="$(jq -c 'select(.type == "version-upload")' "$WRANGLER_OUTPUT_FILE_PATH" | tail -n 1)"
          version_id="$(jq -r '.version_id // empty' <<<"$result")"
          preview_url="$(jq -r '.preview_url // empty' <<<"$result")"
          if [[ -z "$version_id" ]]; then
            echo "::error::wrangler reported no version ID."
            exit 1
          fi
          if [[ -z "$preview_url" ]]; then
            echo "::error::wrangler reported no preview URL. Enable Preview URLs on the Worker and the account's workers.dev subdomain."
            exit 1
          fi
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          {
            echo "### $TAG uploaded, not live yet"
            echo
            echo "- Preview: $preview_url"
            echo "- Worker version: \`$version_id\`"
            echo
            echo "Check the preview, then approve the **marketing-production** deployment to promote it."
          } >> "$GITHUB_STEP_SUMMARY"

  promote:
    name: Promote to akimbo.technology
    needs: [verify-tag, upload]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Required reviewer: the owner. The job waits here until they approve.
    environment:
      name: marketing-production
      url: https://akimbo.technology
    defaults:
      run:
        working-directory: marketing
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: marketing/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: marketing/.nvmrc
          cache: pnpm
          cache-dependency-path: marketing/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          VERSION_ID: ${{ needs.upload.outputs.version_id }}
        run: |
          pnpm exec wrangler versions deploy "$VERSION_ID@100%" --yes --message "Promote $TAG"
          {
            echo "### $TAG is live"
            echo
            echo "Worker version \`$VERSION_ID\` serves 100% of akimbo.technology."
            echo "To undo: \`pnpm exec wrangler rollback --message \"<reason>\"\` from marketing/ (README.md)."
          } >> "$GITHUB_STEP_SUMMARY"
