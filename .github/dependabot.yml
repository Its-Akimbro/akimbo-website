version: 2

# Weekly, one grouped PR per ecosystem for minor and patch updates, which
# should merge green. Each major update opens its own PR, so one breaking
# upgrade doesn't hold back the rest. Security updates are grouped too and
# open as soon as an advisory lands; they ship within 7 days (spec #28).
updates:
  - package-ecosystem: npm # Dependabot's ecosystem name for pnpm too
    directory: /marketing
    schedule:
      interval: weekly
      day: monday
    ignore:
      # typescript-eslint and `astro check` don't support TypeScript 7 yet
      # (PR #46). Drop this once both do.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      marketing-deps:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      marketing-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /portal-edge
    schedule:
      interval: weekly
      day: monday
    ignore:
      # Kept in step with marketing/ (see above).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      portal-edge-deps:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      portal-edge-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
